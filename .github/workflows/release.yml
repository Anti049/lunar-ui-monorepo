name: Release
on:
  push: { branches: [main] }
  workflow_dispatch:

concurrency: { group: release-main, cancel-in-progress: false }

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, registry-url: https://registry.npmjs.org }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Build first: core's export-parity test imports every binding's dist/.
      - run: bun run build:packages
      - run: bun run check # never publish something unverified
      - uses: changesets/action@v2
        with:
          version-script: bunx changeset version
          publish-script: bunx changeset publish
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
