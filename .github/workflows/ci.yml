name: CI
on:
  pull_request:
  push: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # commitlint needs history
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from origin/${{ github.base_ref }} --to HEAD --verbose
      - run: bun run lint
      # Before check: core's export-parity test imports every binding's dist/.
      - run: bun run build:packages
      - run: bun run check # build + typecheck + tests + publint
